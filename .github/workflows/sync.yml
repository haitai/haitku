name: 每日静态化 Notion 动态

# 仓库根目录即本目录（haitku/）：public/data/posts.json 与 public/media/ 需要入库。
on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 可选：Cloudflare Pages → Settings → Deploy hooks 生成的 URL。
      # 未配置时下面的兜底步骤会自动跳过。
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 全量拉取：新增、修改、删除都能同步。已静态化的图片会复用，
      # 无内容变化时 posts.json 逐字节不变，因此不会产生空提交。
      - name: 从 Notion 同步全量数据
        run: npm run sync

      - name: 提交数据变更
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/posts.json public/media
          if git diff --cached --quiet; then
            echo "没有新增或变更，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # commit message 不要含 [skip ci] / CF-Pages-Skip，否则 Cloudflare 会跳过构建
          git commit -m "chore: 同步 Notion 动态 $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 正常路径：Cloudflare Pages 已连接本仓库，push 后自动构建部署
      # （构建命令 npm run build，输出目录 dist，Functions 目录 functions）。
      # 兜底路径：极少数情况下 bot 提交没有触发 Pages 构建，可在仓库 Secrets
      # 中配置 CF_DEPLOY_HOOK，此步骤会在有数据变更时显式 POST 一次构建钩子。
      # 两者都生效时会构建两次（内容相同，无害），因此仅在确认 webhook
      # 不触发时才配置这个 secret。
      - name: 触发 Pages 构建（可选兜底）
        if: steps.commit.outputs.changed == 'true' && env.CF_DEPLOY_HOOK != ''
        run: |
          curl -fsS --max-time 30 -X POST "$CF_DEPLOY_HOOK" \
            -o /dev/null -w "deploy hook HTTP=%{http_code}\n"
